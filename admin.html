<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</head>
<body>
    <h1>Welcome Admin</h1>
    <button onclick="logoutUser()">Logout</button>

    <h2>Add Member</h2>
    <input type="text" id="memberName" placeholder="Name">
    <input type="email" id="memberEmail" placeholder="Email">
    <input type="text" id="package" placeholder="Package">
    <button onclick="addMember(document.getElementById('memberName').value,
                              document.getElementById('memberEmail').value,
                              document.getElementById('package').value)">
        Add Member
    </button>
</body>
</html>
